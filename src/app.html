<!doctype html>
<html lang="en" data-theme="dark">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" content="#1a1a1f" />
		<meta
			name="description"
			content="Ayomikun — frontend engineer building interactive, performant web experiences."
		/>
		<meta property="og:title" content="Ayomikun · Frontend Engineer" />
		<meta
			property="og:description"
			content="Interactive developer portfolio built with SvelteKit."
		/>
		<meta property="og:type" content="website" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" />
		<script>
			// Resolve theme before paint to prevent FOUC. Reads localStorage first,
			// falls back to system preference. Mirrors logic in $lib/stores/theme.svelte.ts.
			(function () {
				try {
					var stored = localStorage.getItem('theme');
					var theme =
						stored === 'light' || stored === 'dark'
							? stored
							: window.matchMedia('(prefers-color-scheme: light)').matches
								? 'light'
								: 'dark';
					document.documentElement.setAttribute('data-theme', theme);
				} catch (e) {
					/* localStorage blocked — keep server-rendered default */
				}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover" class="noise">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
